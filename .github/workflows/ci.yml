name: CI

# Cross-platform CI: run the rite test suites on an
# ubuntu-latest + macos-latest matrix and lint every shell script under
# plugins/rite/ with shellcheck. This surfaces cross-platform regressions
# (bash 4+ features, GNU/BSD tool divergence, flock availability) on every PR
# instead of only in the author's Linux environment.
#
# Job split rationale:
#   - `test` is the OS matrix (the suites are what actually differ by platform).
#   - `shellcheck` is OS-independent, so it runs once on ubuntu only.
#
# macOS is intentionally run with Homebrew bash 5 (rite requires bash 4+) but
# WITHOUT coreutils, leaving date/sed/stat as the BSD variants — that is what
# exposes GNU/BSD divergence. Both platforms are blocking gates; macOS splits
# the hook suite across three shards to keep individual jobs short.

on:
  push:
    branches:
      - develop
      - main
  pull_request:

# Least-privilege: this workflow only reads the repo, never writes back
# (same rationale as sentinel-contract-check.yml).
permissions:
  contents: read

# Cancel superseded in-flight runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}${{ matrix.shard && format(', shard {0}/3', matrix.shard) || '' }})
    runs-on: ${{ matrix.os }}
    # Per-OS limit, at least twice the measured full-job maximum rounded up to
    # whole minutes: macOS peaks at 17.7 minutes, ubuntu at 7. The same test set
    # varies more than 2x across macOS runners, so the macOS limit carries the
    # margin instead of tighter scheduling. "Report job duration" warns when a
    # run passes 70% of its limit.
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: 0
            timeout_minutes: 18
          - os: macos-latest
            shard: 1
            timeout_minutes: 36
          - os: macos-latest
            shard: 2
            timeout_minutes: 36
          - os: macos-latest
            shard: 3
            timeout_minutes: 36

    steps:
      # First step, so the elapsed time reported at the end covers every step.
      - name: Record job start time
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      # actions/checkout pinned by full SHA (v4.2.2) for supply-chain integrity —
      # same convention as the existing workflows.
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      # rite requires bash 4+, but macOS ships bash 3.2 at /bin/bash. Install
      # Homebrew bash (5.x) and prepend it to PATH so `bash <script>` resolves to
      # it. Deliberately do NOT install coreutils: date/sed/stat stay BSD so the
      # suite exercises GNU/BSD divergence (the whole point of the macOS leg).
      - name: Install bash 5 on macOS (keep BSD coreutils)
        if: runner.os == 'macOS'
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      # Fail before any suite if a required tool is unavailable on either OS.
      - name: Verify required tools (bash, jq, git, python3)
        shell: bash
        run: |
          set -euo pipefail
          for tool in bash jq git python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              echo "::error::required tool not available: $tool"
              exit 1
            fi
            tool_path=$(command -v "$tool")
            tool_version=$("$tool" --version 2>&1 | head -1 || echo "(version unknown)")
            if [ -z "$tool_version" ]; then
              tool_version="(empty version output)"
            fi
            echo "::notice::$tool resolved to $tool_path ($tool_version)"
          done

      # Emit environment diagnostics so a failure can be attributed to a specific
      # tool/version difference (MUST: bash --version + jq/flock/gdate
      # presence). set +e so probing a tool that lacks --version (e.g. BSD date)
      # never aborts this informational step.
      - name: Environment diagnostics
        run: |
          set +e
          {
            echo "## Environment — ${{ matrix.os }}"
            echo '```'
            echo "uname:   $(uname -a)"
            echo "bash:    $(bash --version | head -1)"
            echo "bash at: $(command -v bash)"
            echo "jq:      $(command -v jq >/dev/null && jq --version || echo 'MISSING')"
            echo "flock:   $(command -v flock || echo 'absent (expected on macOS)')"
            echo "gdate:   $(command -v gdate || echo 'absent')"
            echo "date:    $(command -v date) — $(date --version 2>/dev/null | head -1 || echo 'BSD date (no --version)')"
            echo "sed:     $(command -v sed) — $(sed --version 2>/dev/null | head -1 || echo 'BSD sed (no --version)')"
            echo "git:     $(git --version)"
            echo "python3: $(command -v python3 >/dev/null && python3 --version || echo 'MISSING')"
            # The test suite's _timeout shim needs timeout(1) or perl(1); with neither,
            # sourcing _test-helpers.sh aborts rather than degrade hang detection.
            echo "timeout: $(command -v timeout || echo 'absent (expected on macOS)')"
            echo "perl:    $(command -v perl >/dev/null && perl -e 'print $^V' || echo 'MISSING — _timeout fallback unavailable')"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # shell: bash forces `bash --noprofile --norc -eo pipefail {0}`. Without it,
      # the default `run:` shell is `bash -e {0}` (NO pipefail), so `<suite> | tee`
      # would take tee's exit code (always 0) and mask a failing suite — the ubuntu
      # blocking job would go green on a real regression. pipefail makes the suite's
      # non-zero exit propagate through the pipe. On macOS, `shell: bash` resolves
      # bash from PATH = the Homebrew bash 5 prepended above.
      - name: Run hook test suite
        if: matrix.shard != 1
        shell: bash
        run: bash plugins/rite/hooks/tests/run-tests.sh ${{ matrix.shard && format('--shard {0}/3', matrix.shard) || '' }} 2>&1 | tee hooks-tests.log

      - name: Run macOS shard 1 test suites
        if: matrix.shard == 1
        shell: bash
        # Overlap shard 1's other suites with its longest hook test. Keep three
        # hook workers to limit contention, and wait for both exit statuses.
        run: |
          (
            bash plugins/rite/scripts/tests/run-all.sh 2>&1 | tee scripts-tests.log
            bash tests/rite-dev.test.sh 2>&1 | tee rite-dev-tests.log
            bash tests/runtime-e2e.test.sh 2>&1 | tee runtime-e2e-tests.log
          ) &
          other_pid=$!
          hook_status=0
          bash plugins/rite/hooks/tests/run-tests.sh --jobs 3 --shard 1/3 2>&1 | tee hooks-tests.log || hook_status=$?
          other_status=0
          wait "$other_pid" || other_status=$?
          [ "$hook_status" -eq 0 ] || exit "$hook_status"
          exit "$other_status"

      - name: Run script test suite
        if: matrix.shard == 0
        shell: bash
        run: bash plugins/rite/scripts/tests/run-all.sh 2>&1 | tee scripts-tests.log

      - name: Run rite-dev launcher test suite
        if: matrix.shard == 0
        shell: bash
        run: bash tests/rite-dev.test.sh 2>&1 | tee rite-dev-tests.log

      - name: Run runtime contract test suite
        if: matrix.shard == 0
        shell: bash
        run: bash tests/runtime-e2e.test.sh 2>&1 | tee runtime-e2e-tests.log

      # SHOULD (AC-5): surface which tests failed and on which OS in
      # the job summary. Runs only when a preceding step failed.
      - name: Summarize test failures
        if: failure()
        run: |
          set +e
          {
            echo "### ❌ Test failures — ${{ matrix.os }}"
            for log in hooks-tests.log scripts-tests.log rite-dev-tests.log runtime-e2e-tests.log; do
              [ -f "$log" ] || continue
              echo "<details><summary>$log</summary>"
              echo ""
              echo '```'
              # `Skip accounting` / `^ERROR: ` cover the runners' skip-drift bail:
              # it fails the job without emitting any FAIL marker, so without these
              # the summary would show only a green-looking "N/N passed" line.
              grep -E 'FAIL|Failed tests:|Skip accounting|^ERROR: |^  - |[0-9]+/[0-9]+ passed|[0-9]+ passed, [0-9]+ failed' "$log" || echo '(no failure markers captured — see full job log)'
              echo '```'
              echo "</details>"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Report the job duration against its timeout so drift toward the limit
      # shows up as a warning before runs get cancelled, plus the slowest hook
      # suite files as the first place to look. The ranking parses the TEST_END
      # lines exactly as run-tests.sh prints them; if that format changes, the
      # step reports "no TEST_END lines" instead of a ranking.
      # A missing input is reported as a warning and the step still exits 0, so a
      # measurement fault never turns the blocking ubuntu leg red.
      - name: Report job duration
        if: always()
        shell: bash
        env:
          TIMEOUT_MINUTES: ${{ matrix.timeout_minutes }}
        run: |
          set +e
          summary() { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }
          summary "### ⏱ Job duration — ${{ matrix.os }}"
          case "${JOB_STARTED_AT:-}:${TIMEOUT_MINUTES:-}" in
            :*|*:|*[!0-9:]*)
              msg="job duration unavailable: JOB_STARTED_AT='${JOB_STARTED_AT:-}' TIMEOUT_MINUTES='${TIMEOUT_MINUTES:-}'"
              echo "::warning::$msg"
              summary "$msg" ;;
            *)
              elapsed=$(( $(date +%s) - JOB_STARTED_AT ))
              limit=$(( TIMEOUT_MINUTES * 60 ))
              msg="job ran $((elapsed / 60))m$((elapsed % 60))s of its ${TIMEOUT_MINUTES}m timeout ($((elapsed * 100 / limit))%)"
              summary "$msg"
              if [ $((elapsed * 10)) -gt $((limit * 7)) ]; then
                echo "::warning::$msg — above 70% of the limit; speed up the suite or raise timeout-minutes"
              else
                echo "::notice::$msg"
              fi ;;
          esac
          if [ ! -f hooks-tests.log ]; then
            msg="slowest hook suite files unavailable: hooks-tests.log not found"
            echo "::warning::$msg"
            summary "$msg"
            exit 0
          fi
          slowest=$(sed -n 's/^TEST_END id=[0-9]* file=\([^ ]*\) rc=[0-9]* duration_s=\([0-9]*\)$/\2 \1/p' hooks-tests.log | sort -rn | head -5)
          if [ -z "$slowest" ]; then
            msg="slowest hook suite files unavailable: no TEST_END lines in hooks-tests.log"
            echo "::warning::$msg"
            summary "$msg"
            exit 0
          fi
          summary "" "Slowest hook suite files (seconds):" '```' "$slowest" '```'

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1

      # shellcheck is pre-installed on GitHub ubuntu runners. It runs over EVERY
      # *.sh under plugins/rite (AC-3). error-severity findings are a
      # BLOCKING gate: the backlog that kept this informational at
      # introduction (baseline error=5) is cleared, so a newly introduced
      # error-level finding fails the job. warning/info/style stay informational
      # and are reported to the job summary for the staged reduction tracked
      # separately (step 3).
      #
      # Note: a failing job only *blocks a merge* once this check is added to the
      # branch's required status checks — a repo-admin setting outside this file.
      - name: shellcheck plugin and runtime test scripts (error = blocking gate)
        run: |
          set -u
          shellcheck --version
          mapfile -t files < <(find plugins/rite -name '*.sh' -type f | sort)
          files+=(tests/rite-dev.test.sh tests/runtime-e2e.test.sh tests/runtime-e2e/prepare.sh)
          echo "shellcheck targets: ${#files[@]} files"
          # One scan at the lowest threshold captures every finding for the report.
          report=$(shellcheck --severity=style --format=json "${files[@]}" 2>/dev/null || true)
          {
            echo "## shellcheck report — plugin and runtime test scripts"
            echo ""
            echo "Target files: ${#files[@]}"
            echo ""
            echo "| level | count |"
            echo "|-------|-------|"
            for lvl in error warning info style; do
              n=$(printf '%s' "$report" | jq --arg l "$lvl" '[.[] | select(.level == $l)] | length' 2>/dev/null || echo '?')
              echo "| $lvl | $n |"
            done
            echo ""
            echo "> error is a blocking gate. warning/info/style stay informational; staged reduction tracked separately."
            echo ""
            echo "<details><summary>error-level findings</summary>"
            echo ""
            echo '```'
            printf '%s' "$report" | jq -r '.[] | select(.level == "error") | "\(.file):\(.line):\(.column) SC\(.code) \(.message)"' 2>/dev/null || echo '(none)'
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          # Blocking gate: re-scan at severity=error and let shellcheck's own exit
          # code decide (non-zero iff findings at/above the threshold). Using the
          # exit code rather than a jq-parsed count means a shellcheck invocation
          # failure fails the job loudly instead of passing silently on an empty
          # report.
          if shellcheck --severity=error "${files[@]}"; then
            echo "✅ shellcheck: no error-severity findings (blocking gate passed)"
          else
            echo "::error::shellcheck found error-severity findings — blocking gate failed"
            exit 1
          fi

      - name: number-free surface (blocking)
        run: bash plugins/rite/hooks/scripts/number-reference-check.sh --all
