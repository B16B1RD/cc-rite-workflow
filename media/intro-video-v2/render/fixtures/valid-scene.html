<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>valid-scene — シーン契約の最小例</title>
<style>
  html, body { margin: 0; width: 1280px; height: 720px; background: #0E1117; }
  body { display: grid; place-items: center; font-family: "Inter", sans-serif; }
  .mark {
    color: #E8B339;
    font-size: 96px;
    letter-spacing: 0.08em;
    /* transition ではなく keyframes。fill-mode: both が無いと seek 範囲外のフレームが
       初期値へ戻り、尺の先頭・末尾が意図しない絵になる。 */
    animation: rise 2000ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <div class="mark">rite</div>
  <script>window.SCENE = { duration_ms: 2000 };</script>
</body>
</html>
