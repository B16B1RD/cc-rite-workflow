<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>rite — autonomous pipeline</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: #080b10;
  }
  body {
    display: grid;
    place-items: center;
    font-family: "Inter", "Noto Sans JP", system-ui, sans-serif;
    color: #e8edf5;
  }
  body::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 50% 44%, rgba(86, 110, 158, .13), transparent 43%),
      linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px);
    background-size: auto, 100% 4px;
  }
  .terminal {
    position: relative;
    width: 1030px;
    height: 510px;
    border: 1px solid #222a37;
    border-radius: 18px;
    background: rgba(12, 16, 23, .96);
    box-shadow: 0 38px 100px rgba(0, 0, 0, .55);
    overflow: hidden;
    animation: terminal-in 900ms cubic-bezier(.2,.8,.2,1) both;
  }
  .bar {
    height: 52px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 0 20px;
    border-bottom: 1px solid #202733;
    background: #10151d;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #353e4d; }
  .bar-label {
    margin-left: auto;
    color: #647083;
    font: 500 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .12em;
  }
  .screen {
    padding: 52px 58px;
    font: 500 24px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .line {
    opacity: 0;
    transform: translateY(12px);
    animation: line-in 500ms cubic-bezier(.2,.8,.2,1) both;
  }
  .command { color: #f4f7fb; animation-delay: 850ms; }
  .command .prompt { color: #e7b452; }
  .pipeline {
    margin-top: 48px;
    color: #9ca8b8;
    font-size: 22px;
    animation-delay: 2200ms;
  }
  .pipeline .arrow { color: #566273; padding: 0 8px; }
  .result {
    display: flex;
    align-items: center;
    width: fit-content;
    min-width: 460px;
    margin-top: 30px;
    padding: 10px 15px;
    border-left: 2px solid #69d49a;
    background: rgba(105, 212, 154, .055);
    color: #76dda5;
    font-size: 20px;
  }
  .review { animation-delay: 4100ms; }
  .merge { animation-delay: 5850ms; }
  .caret {
    display: inline-block;
    width: 10px;
    height: 25px;
    margin-left: 7px;
    vertical-align: -4px;
    background: #e7b452;
    animation: blink 800ms steps(1, end) 900ms 3 both;
  }
  .pulse {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    pointer-events: none;
    animation: finish 1200ms ease-out 6800ms both;
  }
  @keyframes terminal-in {
    from { opacity: 0; transform: translateY(24px) scale(.985); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes line-in {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  @keyframes finish {
    0% { box-shadow: inset 0 0 0 1px rgba(105,212,154,0); }
    35% { box-shadow: inset 0 0 0 1px rgba(105,212,154,.55); }
    100% { box-shadow: inset 0 0 0 1px rgba(105,212,154,0); }
  }
</style>
</head>
<body>
  <main class="terminal">
    <div class="bar">
      <i class="dot"></i><i class="dot"></i><i class="dot"></i>
      <span class="bar-label">RITE / BATCH</span>
    </div>
    <div class="screen">
      <div class="line command"><span class="prompt">$</span> /rite:batch-run --merge 2241<span class="caret"></span></div>
      <div class="line pipeline">open <span class="arrow">→</span> iterate <span class="arrow">→</span> ready <span class="arrow">→</span> merge <span class="arrow">→</span> cleanup</div>
      <div class="line result review">[review:mergeable]</div>
      <div class="line result merge">[merge:returned-to-caller]</div>
    </div>
    <div class="pulse"></div>
  </main>
  <script>window.SCENE = { duration_ms: 9000 };</script>
</body>
</html>
