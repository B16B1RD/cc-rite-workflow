<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>rite — autonomous loop</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; }
    body {
      color: #eef4fa; background: #080b10;
      font-family: Inter, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    }
    .ambient { position: absolute; inset: 0; background: radial-gradient(circle at 50% 47%, rgba(51,178,157,.12), transparent 35%), radial-gradient(circle at 90% 90%, rgba(95,90,220,.08), transparent 30%); }
    header { position: absolute; left: 68px; right: 68px; top: 50px; display: flex; justify-content: space-between; align-items: baseline; animation: enter .7s ease-out 0s both; }
    .brand { color: #7ee7d0; font: 650 16px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .18em; }
    .caption { color: #657184; font: 500 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .13em; }
    h1 { position: absolute; left: 68px; top: 109px; margin: 0; font-size: 38px; line-height: 1.3; letter-spacing: -.035em; font-weight: 650; animation: enter .8s cubic-bezier(.16,1,.3,1) .15s both; }
    h1 span { color: #7ee7d0; }
    .loop { position: absolute; left: 92px; top: 245px; width: 1096px; height: 300px; }
    .track { position: absolute; inset: 0; }
    .track path { fill: none; stroke: rgba(140,160,180,.21); stroke-width: 2; stroke-linecap: round; animation: trackIn 1.1s ease-out .45s both; }
    .track .linear { stroke-dasharray: 7 11; }
    .track .loopline { stroke: rgba(126,231,208,.38); stroke-dasharray: 7 9; }
    .track .flow { stroke: #6fdbc5; stroke-width: 2.5; stroke-dasharray: 115 570; filter: drop-shadow(0 0 7px rgba(111,219,197,.55)); animation: flow 2.4s linear 2.35s 2 both; }
    .node { position: absolute; width: 172px; height: 104px; padding: 20px 21px; border-radius: 17px; border: 1px solid rgba(195,211,228,.14); background: linear-gradient(145deg, rgba(25,31,41,.98), rgba(14,18,25,.98)); box-shadow: 0 18px 45px rgba(0,0,0,.3); opacity: .54; }
    .node::before { content: attr(data-step); display: block; margin-bottom: 14px; color: #667487; font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; }
    .node strong { display: block; font-size: 22px; font-weight: 620; letter-spacing: .01em; }
    .issue { left: 0; top: 98px; animation: nodeIn .55s ease-out .45s both, active 7s ease-in-out .75s 1 both; }
    .build { left: 230px; top: 98px; animation: nodeIn .55s ease-out .65s both, active 7s ease-in-out 1.4s 1 both; }
    .review { left: 502px; top: 18px; animation: nodeIn .55s ease-out .85s both, active 2.4s ease-in-out 2.25s 2 both; }
    .fix { left: 502px; bottom: 14px; animation: nodeIn .55s ease-out 1.05s both, active 2.4s ease-in-out 3.05s 2 both; }
    .core { position: absolute; right: 0; top: 75px; width: 190px; height: 150px; display: grid; place-content: center; text-align: center; border-radius: 50%; border: 1px solid rgba(126,231,208,.32); background: radial-gradient(circle, rgba(28,64,61,.95), rgba(11,18,22,.97) 69%); box-shadow: 0 0 0 13px rgba(126,231,208,.025), 0 0 70px rgba(90,215,190,.11); animation: coreIn .8s cubic-bezier(.16,1,.3,1) 5.9s both, breathe 2.4s ease-in-out 6s 1 both; }
    .core b { color: #7ee7d0; font: 700 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; }
    .core span { margin-top: 13px; color: #a7b5c5; font-size: 13px; letter-spacing: .08em; }
    .result { position: absolute; left: 50%; bottom: 53px; display: flex; align-items: center; gap: 13px; color: #c8d3df; font-size: 15px; letter-spacing: .08em; animation: resultIn .75s cubic-bezier(.16,1,.3,1) 6.55s both; }
    .result::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #7ee7d0; box-shadow: 0 0 16px #7ee7d0; }
    @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes trackIn { from { opacity: 0; stroke-dashoffset: 90; } to { opacity: 1; stroke-dashoffset: 0; } }
    @keyframes flow { from { stroke-dashoffset: 0; opacity: .25; } 20% { opacity: 1; } to { stroke-dashoffset: -570; opacity: .25; } }
    @keyframes nodeIn { from { opacity: 0; transform: translateY(13px) scale(.97); } to { opacity: .54; transform: translateY(0) scale(1); } }
    @keyframes active { 0%,18%,100% { opacity: .54; border-color: rgba(195,211,228,.14); transform: scale(1); } 8% { opacity: 1; border-color: rgba(126,231,208,.7); transform: scale(1.035); box-shadow: 0 20px 55px rgba(0,0,0,.4), 0 0 28px rgba(91,211,187,.12); } }
    @keyframes coreIn { from { opacity: 0; transform: scale(.78); } to { opacity: 1; transform: scale(1); } }
    @keyframes breathe { 0%,100% { box-shadow: 0 0 0 13px rgba(126,231,208,.025), 0 0 55px rgba(90,215,190,.08); } 50% { box-shadow: 0 0 0 17px rgba(126,231,208,.04), 0 0 85px rgba(90,215,190,.18); } }
    @keyframes resultIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <header><div class="brand">RITE / 02</div><div class="caption">AUTONOMOUS DELIVERY LOOP</div></header>
  <h1>レビューと修正を、<span>自律的に反復。</span></h1>
  <main class="loop">
    <svg class="track" viewBox="0 0 1096 300" aria-hidden="true">
      <path class="linear" d="M172 150 H230 M402 150 H500 M674 150 H906" />
      <path class="loopline" d="M588 122 C690 105 705 18 588 18 C471 18 476 105 588 122 M588 178 C476 195 471 282 588 282 C705 282 690 195 588 178" />
      <path class="flow" d="M588 122 C690 105 705 18 588 18 C471 18 476 105 588 122 M588 178 C476 195 471 282 588 282 C705 282 690 195 588 178" />
    </svg>
    <section class="node issue" data-step="01 / DEFINE"><strong>Issue</strong></section>
    <section class="node build" data-step="02 / BUILD"><strong>実装</strong></section>
    <section class="node review" data-step="03 / VERIFY"><strong>レビュー</strong></section>
    <section class="node fix" data-step="04 / REFINE"><strong>修正</strong></section>
    <div class="core"><b>収束</b><span>MERGEABLE</span></div>
  </main>
  <div class="result">mergeable へ収束</div>
  <script>window.SCENE = { duration_ms: 8000 };</script>
</body>
</html>
