<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>rite — M6 second lap</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1280px; height: 720px; margin: 0; overflow: hidden; }
    body {
      color: #eef4fa; background: #080b10;
      font-family: Inter, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      letter-spacing: .02em;
    }
    .ambient { position: absolute; inset: 0; background: radial-gradient(circle at 76% 34%, rgba(51,178,157,.12), transparent 34%), radial-gradient(circle at 10% 88%, rgba(95,90,220,.08), transparent 30%); }
    header { position: absolute; left: 68px; right: 68px; top: 50px; display: flex; justify-content: space-between; align-items: baseline; animation: enter .7s ease-out 0s both; }
    .brand { color: #7ee7d0; font: 650 16px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .18em; }
    .caption { color: #657184; font: 500 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .13em; }
    h1 {
      position: absolute; left: 68px; top: 106px; margin: 0;
      font-size: 38px; font-weight: 650; line-height: 1.3; letter-spacing: -.035em;
      animation: enter .8s cubic-bezier(.16,1,.3,1) .15s both;
    }
    h1 span { color: #7ee7d0; }

    .term {
      position: absolute; left: 68px; top: 240px; width: 620px; height: 336px;
      border-radius: 15px; border: 1px solid rgba(195,211,228,.16);
      background: linear-gradient(160deg, rgba(16,21,29,.99), rgba(9,12,17,.99));
      box-shadow: 0 24px 60px rgba(0,0,0,.4);
      animation: enter .7s ease-out .55s both;
      font: 500 19px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .term-bar { display: flex; gap: 7px; padding: 15px 18px 12px; border-bottom: 1px solid rgba(195,211,228,.09); }
    .term-bar i { width: 11px; height: 11px; border-radius: 50%; background: rgba(160,176,192,.25); }
    .term-body { padding: 20px 26px; display: flex; flex-direction: column; gap: 15px; }
    .tl .p { color: #667487; }
    .tl.cmd { color: #eef4fa; animation: tlIn .4s ease-out 1.1s both; }
    .tl.open { color: #a7b5c5; animation: tlIn .4s ease-out 2.0s both; }
    .tl.inject { color: #7ee7d0; animation: tlIn .5s ease-out 4.5s both; }
    .tl.next { color: #a7b5c5; animation: tlIn .4s ease-out 5.6s both; }

    .arrow {
      position: absolute; left: 688px; top: 392px; width: 36px; height: 2px;
      background: rgba(126,231,208,.55); transform-origin: 100% 50%;
      animation: growX .4s ease-out 4.2s both;
    }
    .arrow::before {
      content: ""; position: absolute; left: -1px; top: -4px;
      border: 5px solid transparent; border-right-color: rgba(126,231,208,.75);
    }

    /* M5 で生まれたカードが、次のループの実装前に届く（見出し・ドメイン・確信度は M5 と同一） */
    .ipanel {
      position: absolute; left: 724px; top: 258px; width: 488px;
      border-radius: 15px; border: 1px solid rgba(126,231,208,.42);
      background: linear-gradient(145deg, rgba(20,34,36,.98), rgba(11,17,22,.98));
      padding: 18px 22px 16px;
      box-shadow: 0 24px 60px rgba(0,0,0,.45), 0 0 34px rgba(111,219,197,.12);
      animation: ipIn .7s cubic-bezier(.16,1,.3,1) 3.3s both;
    }
    .ip-head { color: #7ee7d0; font: 650 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .12em; margin-bottom: 13px; }
    .ip-card { border-left: 3px solid #6fdbc5; padding-left: 15px; }
    .ip-title { font-size: 17.5px; font-weight: 650; line-height: 1.5; margin-bottom: 9px; }
    .ip-meta { display: flex; gap: 7px; }
    .wc-chip { font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .07em; color: #9fb2c3; border: 1px solid rgba(159,178,195,.3); border-radius: 999px; padding: 5px 11px; }
    .wc-chip.hot { color: #7ee7d0; border-color: rgba(126,231,208,.45); }

    .result {
      position: absolute; left: 50%; bottom: 46px; display: flex; align-items: center; gap: 13px;
      color: #c8d3df; font-size: 15px; letter-spacing: .08em;
      animation: resultIn .75s cubic-bezier(.16,1,.3,1) 6.4s both;
    }
    .result::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #7ee7d0; box-shadow: 0 0 16px #7ee7d0; }

    @keyframes enter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes tlIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes ipIn { from { opacity: 0; transform: translateX(38px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes growX { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
    @keyframes resultIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  </style>
</head>
<body>
  <div class="ambient"></div>
  <header><div class="brand">RITE / M6</div><div class="caption">SECOND LAP</div></header>
  <h1>2 周目は、<span>学んだ状態で始まる。</span></h1>

  <main class="term">
    <div class="term-bar"><i></i><i></i><i></i></div>
    <div class="term-body">
      <div class="tl cmd"><span class="p">$</span> /rite:batch-run 2259</div>
      <div class="tl open">▸ open&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;issue #2259 — ブランチ / draft PR 作成</div>
      <div class="tl inject">📚 wiki 経験則を注入 — 1 件（実装前に適用）</div>
      <div class="tl next">▸ iterate&nbsp;&nbsp;実装 → レビュー → 修正 …</div>
    </div>
  </main>

  <div class="arrow"></div>

  <aside class="ipanel">
    <div class="ip-head">📚 WIKI 経験則（自動参照）</div>
    <div class="ip-card">
      <div class="ip-title">エラーメッセージの grep assert は locale 依存で空振りする</div>
      <div class="ip-meta">
        <span class="wc-chip hot">anti-patterns</span>
        <span class="wc-chip">確信度: high</span>
      </div>
    </div>
  </aside>

  <div class="result">同じ盲点を、二度踏まない。</div>
  <script>window.SCENE = { duration_ms: 8000 };</script>
</body>
</html>
